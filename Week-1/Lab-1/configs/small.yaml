seed: 1234
data_dir: data/tokens-32k
output_dir: runs/small

model:
  max_seq_len: 512
  n_layer: 4
  n_head: 4
  n_embd: 256
  dropout: 0.0
  tie_embeddings: true

training:
  batch_size: 192
  gradient_accumulation: 1
  train_tokens: 1000000000
  learning_rate: 0.001
  min_learning_rate: 0.0001
  warmup_steps: 100
  weight_decay: 0.1
  gradient_clip: 1.0
  log_interval: 20
  eval_interval: 200
  eval_batches: 20
  eval_batch_size: 64
